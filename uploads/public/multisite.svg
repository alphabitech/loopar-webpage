<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset=".5" stop-color="#bd34fe"/><stop offset="1" stop-color="#41d1ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d31"/><stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="corebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241b3d"/><stop offset=".5" stop-color="#1b2440"/><stop offset="1" stop-color="#1a1f3a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="22" fill="#10101a"/>

  <text x="40" y="44" fill="#f1f1f8" font-size="16" font-weight="700">One tenant, several websites</text>
  <text x="40" y="66" fill="#8585a3" font-size="11.5">each domain renders the website of its app · one Desk on the main domain manages them all</text>

  <!-- domains -->
  <g font-family="ui-monospace,monospace" font-size="12">
    <g filter="url(#soft)"><rect x="40" y="100" width="190" height="48" rx="12" fill="url(#panel)" stroke="url(#loop)" stroke-width="1.5"/></g>
    <text x="58" y="122" fill="#f1f1f8">admin.acme.com</text><text x="58" y="139" fill="#8585a3" font-size="10.5">main domain · Desk</text>

    <g filter="url(#soft)"><rect x="262" y="100" width="190" height="48" rx="12" fill="url(#panel)" stroke="#3a3a59" stroke-width="1.5"/></g>
    <text x="280" y="122" fill="#f1f1f8">acme.com</text><text x="280" y="139" fill="#8585a3" font-size="10.5">= acme-site</text>

    <g filter="url(#soft)"><rect x="484" y="100" width="190" height="48" rx="12" fill="url(#panel)" stroke="#3a3a59" stroke-width="1.5"/></g>
    <text x="502" y="122" fill="#f1f1f8">shop.acme.com</text><text x="502" y="139" fill="#8585a3" font-size="10.5">= acme-shop</text>

    <g filter="url(#soft)"><rect x="706" y="100" width="214" height="48" rx="12" fill="url(#panel)" stroke="#3a3a59" stroke-width="1.5"/></g>
    <text x="724" y="122" fill="#f1f1f8">blog.dev</text><text x="724" y="139" fill="#8585a3" font-size="10.5">= personal-blog</text>
  </g>

  <!-- desk 404 chips -->
  <g font-family="ui-monospace,monospace" font-size="10">
    <rect x="262" y="156" width="104" height="18" rx="9" fill="#2a1a24"/><text x="272" y="169" fill="#f0a3b4">/desk → 404</text>
    <rect x="484" y="156" width="104" height="18" rx="9" fill="#2a1a24"/><text x="494" y="169" fill="#f0a3b4">/desk → 404</text>
    <rect x="706" y="156" width="104" height="18" rx="9" fill="#2a1a24"/><text x="716" y="169" fill="#f0a3b4">/desk → 404</text>
  </g>

  <!-- lines to caddy/core -->
  <g stroke="#4d4d72" stroke-width="2" fill="none">
    <path d="M135 148 C 135 196, 480 186, 480 214"/>
    <path d="M357 176 C 357 200, 480 192, 480 214"/>
    <path d="M579 176 C 579 200, 480 192, 480 214"/>
    <path d="M813 176 C 813 200, 480 190, 480 214"/>
  </g>

  <!-- core / tenant -->
  <g filter="url(#soft)"><rect x="120" y="214" width="720" height="70" rx="16" fill="url(#corebar)" stroke="url(#loop)" stroke-width="2"/></g>
  <rect x="120" y="214" width="6" height="70" rx="3" fill="url(#loop)"/>
  <text x="150" y="244" fill="#f1f1f8" font-size="15" font-weight="700">Caddy → Loopar core → tenant "acme"</text>
  <text x="150" y="266" fill="#8585a3" font-size="11.5">host decides the tenant and its website app · one database · one admin · automatic SSL for every domain</text>

  <g stroke="#4d4d72" stroke-width="2" fill="none">
    <path d="M480 284 C 480 306, 228 302, 228 324"/>
    <path d="M480 284 L480 324"/>
    <path d="M480 284 C 480 306, 732 302, 732 324"/>
  </g>

  <!-- apps -->
  <g filter="url(#soft)"><rect x="120" y="324" width="216" height="150" rx="15" fill="url(#panel)" stroke="#3a3a59" stroke-width="1.5"/></g>
  <text x="144" y="356" fill="#f1f1f8" font-size="14" font-weight="700">acme-site</text>
  <text x="144" y="380" fill="#8585a3" font-size="11.5">menu · header · theme</text>
  <text x="144" y="402" fill="#8585a3" font-size="11.5">pages from any app</text>
  <text x="144" y="424" fill="#8585a3" font-size="11.5">posts · services · legal</text>
  <text x="144" y="452" fill="#9a9ac0" font-size="10.5" font-family="ui-monospace,monospace">has_website ✓</text>

  <g filter="url(#soft)"><rect x="372" y="324" width="216" height="150" rx="15" fill="url(#panel)" stroke="#3a3a59" stroke-width="1.5"/></g>
  <text x="396" y="356" fill="#f1f1f8" font-size="14" font-weight="700">acme-shop</text>
  <text x="396" y="380" fill="#8585a3" font-size="11.5">its own menu and theme</text>
  <text x="396" y="402" fill="#8585a3" font-size="11.5">payments · collections</text>
  <text x="396" y="424" fill="#8585a3" font-size="11.5">shares the tenant's data</text>
  <text x="396" y="452" fill="#9a9ac0" font-size="10.5" font-family="ui-monospace,monospace">has_website ✓</text>

  <g filter="url(#soft)"><rect x="624" y="324" width="216" height="150" rx="15" fill="url(#panel)" stroke="#3a3a59" stroke-width="1.5"/></g>
  <text x="648" y="356" fill="#f1f1f8" font-size="14" font-weight="700">personal-blog</text>
  <text x="648" y="380" fill="#8585a3" font-size="11.5">posts · comments</text>
  <text x="648" y="402" fill="#8585a3" font-size="11.5">messages tagged by site</text>
  <text x="648" y="424" fill="#8585a3" font-size="11.5">analytics per page</text>
  <text x="648" y="452" fill="#9a9ac0" font-size="10.5" font-family="ui-monospace,monospace">has_website ✓</text>
</svg>
