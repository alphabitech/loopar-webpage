<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset=".5" stop-color="#bd34fe"/><stop offset="1" stop-color="#41d1ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d31"/><stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d6d9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" rx="22" fill="#10101a"/>
  <!-- title -->
  <text x="40" y="44" fill="#f1f1f8" font-size="16" font-weight="700">Workflow: states and transitions as data</text>
  <text x="40" y="66" fill="#8585a3" font-size="11.5">the state field only changes through a transition — roles, required fields and beforeTransition() are checked first</text>

  <!-- states -->
  <g font-size="13" font-weight="600">
    <g filter="url(#soft)"><rect x="40" y="110" width="150" height="56" rx="14" fill="url(#panel)" stroke="#55556f" stroke-width="1.5"/></g>
    <circle cx="62" cy="138" r="5" fill="#9ca3af"/><text x="76" y="143" fill="#e5e5f0">Draft</text>
    <rect x="128" y="128" width="50" height="18" rx="9" fill="#23233a"/><text x="136" y="141" fill="#9a9ac0" font-size="9.5" font-weight="500">initial</text>

    <g filter="url(#soft)"><rect x="300" y="110" width="170" height="56" rx="14" fill="url(#panel)" stroke="#3b82f6" stroke-width="1.5"/></g>
    <circle cx="322" cy="138" r="5" fill="#60a5fa"/><text x="336" y="143" fill="#e5e5f0">Submitted</text>

    <g filter="url(#soft)"><rect x="600" y="86" width="160" height="50" rx="14" fill="url(#panel)" stroke="#22c55e" stroke-width="1.5"/></g>
    <circle cx="622" cy="111" r="5" fill="#4ade80"/><text x="636" y="116" fill="#e5e5f0">Approved</text>
    <rect x="706" y="102" width="42" height="18" rx="9" fill="#23233a"/><text x="714" y="115" fill="#9a9ac0" font-size="9.5" font-weight="500">final</text>

    <g filter="url(#soft)"><rect x="600" y="146" width="160" height="50" rx="14" fill="url(#panel)" stroke="#ef4444" stroke-width="1.5"/></g>
    <circle cx="622" cy="171" r="5" fill="#f87171"/><text x="636" y="176" fill="#e5e5f0">Rejected</text>
    <rect x="706" y="162" width="42" height="18" rx="9" fill="#23233a"/><text x="714" y="175" fill="#9a9ac0" font-size="9.5" font-weight="500">final</text>
  </g>

  <!-- transitions -->
  <g stroke="#6d6d9a" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M190 138 L296 138"/>
    <path d="M470 130 C 530 120, 550 111, 596 111"/>
    <path d="M470 146 C 530 156, 550 171, 596 171"/>
  </g>
  <g font-size="10.5" font-weight="600">
    <rect x="207" y="112" width="72" height="18" rx="9" fill="#2a2150" stroke="url(#loop)"/><text x="222" y="125" fill="#c9b6ff">Submit</text>
    <rect x="490" y="92" width="80" height="18" rx="9" fill="#2a2150" stroke="url(#loop)"/><text x="506" y="105" fill="#c9b6ff">Approve</text>
    <rect x="490" y="176" width="80" height="18" rx="9" fill="#2a2150" stroke="url(#loop)"/><text x="509" y="189" fill="#c9b6ff">Reject</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="10" fill="#8585a3">
    <text x="476" y="226">roles: Request Manager · required: notes</text>
  </g>

  <!-- kanban board -->
  <g filter="url(#soft)"><rect x="40" y="262" width="880" height="270" rx="16" fill="#151522" stroke="#3a3a59" stroke-width="1.5"/></g>
  <rect x="40" y="262" width="6" height="270" rx="3" fill="url(#loop)"/>
  <text x="68" y="292" fill="#f1f1f8" font-size="14" font-weight="700">Kanban view</text>
  <text x="168" y="292" fill="#8585a3" font-size="11.5">one column per state · drop a card to run the transition that joins both columns</text>

  <g font-size="12" font-weight="600">
    <!-- columns -->
    <rect x="68" y="310" width="196" height="200" rx="12" fill="#1c1c2e"/>
    <circle cx="86" cy="330" r="4.5" fill="#9ca3af"/><text x="98" y="334" fill="#d4d4e4">Draft</text><text x="240" y="334" fill="#77779a" font-size="11">2</text>
    <rect x="80" y="346" width="172" height="44" rx="9" fill="#26263c" stroke="#33334f"/><text x="92" y="366" fill="#e5e5f0" font-size="11.5">REQ-0012</text><text x="92" y="381" fill="#8585a3" font-size="10.5" font-weight="400">Laptop for new hire</text>
    <rect x="80" y="398" width="172" height="44" rx="9" fill="#26263c" stroke="#33334f"/><text x="92" y="418" fill="#e5e5f0" font-size="11.5">REQ-0011</text><text x="92" y="433" fill="#8585a3" font-size="10.5" font-weight="400">Conference tickets</text>

    <rect x="280" y="310" width="196" height="200" rx="12" fill="#1c1c2e"/>
    <circle cx="298" cy="330" r="4.5" fill="#60a5fa"/><text x="310" y="334" fill="#d4d4e4">Submitted</text><text x="452" y="334" fill="#77779a" font-size="11">1</text>
    <rect x="292" y="346" width="172" height="44" rx="9" fill="#26263c" stroke="#33334f"/><text x="304" y="366" fill="#e5e5f0" font-size="11.5">REQ-0009</text><text x="304" y="381" fill="#8585a3" font-size="10.5" font-weight="400">Office chairs</text>
    <rect x="492" y="310" width="196" height="200" rx="12" fill="#1a2420" stroke="#22c55e" stroke-opacity=".5" stroke-dasharray="5 4"/>
    <circle cx="510" cy="330" r="4.5" fill="#4ade80"/><text x="522" y="334" fill="#d4d4e4">Approved</text><text x="664" y="334" fill="#77779a" font-size="11">4</text>
    <rect x="504" y="346" width="172" height="44" rx="9" fill="#26263c" stroke="#33334f"/><text x="516" y="366" fill="#e5e5f0" font-size="11.5">REQ-0005</text><text x="516" y="381" fill="#8585a3" font-size="10.5" font-weight="400">Monitors</text>

    <rect x="704" y="310" width="196" height="200" rx="12" fill="#1c1c2e"/>
    <circle cx="722" cy="330" r="4.5" fill="#f87171"/><text x="734" y="334" fill="#d4d4e4">Rejected</text><text x="876" y="334" fill="#77779a" font-size="11">1</text>
    <rect x="716" y="346" width="172" height="44" rx="9" fill="#26263c" stroke="#33334f"/><text x="728" y="366" fill="#e5e5f0" font-size="11.5">REQ-0004</text><text x="728" y="381" fill="#8585a3" font-size="10.5" font-weight="400">Team offsite</text>
  </g>
  <!-- dragging card -->
    <g transform="rotate(-4 600 420)">
      <rect x="512" y="396" width="172" height="44" rx="9" fill="#2d2d48" stroke="url(#loop)" stroke-width="1.5" filter="url(#soft)"/>
      <text x="524" y="416" fill="#f1f1f8" font-size="11.5">REQ-0007</text><text x="524" y="431" fill="#a5a5c8" font-size="10.5" font-weight="400">Software licenses</text>
    </g>
    <path d="M470 418 C 490 418, 500 418, 508 418" stroke="#6d6d9a" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

</svg>
